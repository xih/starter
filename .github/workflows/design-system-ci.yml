name: Design System CI

on:
  pull_request:

concurrency:
  group: design-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  design-system:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - run: make ci-install

      - name: Design-system checks
        run: make design-check

      - name: Typecheck
        run: make ci-typecheck

      - name: Install Playwright browsers
        run: corepack pnpm --filter @starter/web exec playwright install chromium

      - name: Storybook tests
        run: corepack pnpm test-storybook

      - name: Check Chromatic token
        id: chromatic-token
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "Skipping Chromatic because CHROMATIC_PROJECT_TOKEN is unavailable."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Chromatic visual tests
        if: steps.chromatic-token.outputs.available == 'true'
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          storybookBuildDir: apps/web/storybook-static
          skip: ${{ github.event_name == 'pull_request' }}
          exitZeroOnChanges: true
