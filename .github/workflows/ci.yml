name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - name: Install dependencies
        run: make ci-install

      - name: Check formatting
        run: make ci-format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - name: Install dependencies
        run: make ci-install

      - name: Run lint checks
        run: make ci-lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - name: Install dependencies
        run: make ci-install

      - name: Run typecheck
        run: make ci-typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - name: Install dependencies
        run: make ci-install

      - name: Run tests
        run: make ci-test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - name: Install dependencies
        run: make ci-install

      - name: Build
        run: make ci-build
